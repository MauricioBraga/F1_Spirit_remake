name: Build macOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DEPS_PREFIX: /Users/runner/f1spirit-deps
  SDL_VERSION: release-3.2.16

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja pkg-config

      # SDL3/SDL3_mixer/SDL3_image built from source into a dedicated
      # prefix (not /usr/local or /opt/homebrew, so it can't collide with
      # anything Homebrew manages, and so it's easy to point CI's cache
      # at exactly this one folder).
      - name: Cache SDL3 build
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_PREFIX }}
          key: sdl3-macos-${{ env.SDL_VERSION }}-v1

      - name: Build SDL3 (core)
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.SDL_VERSION }} https://github.com/libsdl-org/SDL.git /tmp/SDL3
          cmake -S /tmp/SDL3 -B /tmp/SDL3/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ env.DEPS_PREFIX }}
          cmake --build /tmp/SDL3/build
          cmake --install /tmp/SDL3/build

      - name: Build SDL3_image
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL_image.git /tmp/SDL3_image
          cmake -S /tmp/SDL3_image -B /tmp/SDL3_image/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ env.DEPS_PREFIX }} \
            -DCMAKE_PREFIX_PATH=${{ env.DEPS_PREFIX }}
          cmake --build /tmp/SDL3_image/build
          cmake --install /tmp/SDL3_image/build

      - name: Build SDL3_mixer
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL_mixer.git /tmp/SDL3_mixer
          cmake -S /tmp/SDL3_mixer -B /tmp/SDL3_mixer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=${{ env.DEPS_PREFIX }} \
            -DCMAKE_PREFIX_PATH=${{ env.DEPS_PREFIX }}
          cmake --build /tmp/SDL3_mixer/build
          cmake --install /tmp/SDL3_mixer/build

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH=${{ env.DEPS_PREFIX }}

      - name: Build
        run: cmake --build build

      - name: Package (.app bundle with dylibs relocated via install_name_tool)
        run: bash ci/package-macos.sh "${{ env.DEPS_PREFIX }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1SpiritRemake-macos
          path: dist/F1SpiritRemake-macos.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/F1SpiritRemake-macos.zip
