name: Build Windows

# Runs whenever a version tag is pushed (e.g. "v1.0.0"), or manually via the
# "Run workflow" button in the Actions tab.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write     # needed to create the GitHub Release and upload the zip

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-sdl3-mixer
            mingw-w64-ucrt-x86_64-sdl3-image
            mingw-w64-ucrt-x86_64-sdl3-ttf
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-freeglut
            zip

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package (bundles every DLL dependency, transitive included)
        run: bash ci/package-windows.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: F1SpiritRemake-windows
          path: dist/F1SpiritRemake-windows.zip
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/F1SpiritRemake-windows.zip
